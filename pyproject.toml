[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brainged"
version = "0.1.0"
description = "Reference implementation of the BrainGED similarity measure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Boseong Kim"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/labhai/BrainGED"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
